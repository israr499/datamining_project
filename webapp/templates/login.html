<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ElectroGuard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2E86AB;
            --primary-dark: #1B4F6E;
            --secondary: #4ECDC4;
            --accent: #F18F01;
            --success: #27AE60;
            --danger: #DC2626;
            --dark: #1F2937;
            --gray: #6B7280;
            --light: #F4F9FB;
            --white: #FFFFFF;
            --border: #DCE7EB;
            --shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(46, 134, 171, 0.18), transparent 34%),
                radial-gradient(circle at bottom right, rgba(78, 205, 196, 0.18), transparent 35%),
                linear-gradient(135deg, #F8FCFD 0%, #EAF6F8 55%, #F7FBFC 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--dark);
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(220, 231, 235, 0.9);
            border-radius: 26px;
            padding: 42px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.45s ease;
            backdrop-filter: blur(12px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 14px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 34px;
            box-shadow: 0 14px 28px rgba(46, 134, 171, 0.25);
        }

        .logo h2 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--gray);
            font-size: 14px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-weight: 800;
            color: var(--dark);
            font-size: 14px;
        }

        .form-group label i {
            color: var(--primary);
            margin-right: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            background: #FBFDFE;
            transition: all 0.25s ease;
            color: var(--dark);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(46, 134, 171, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 12px 24px rgba(46, 134, 171, 0.24);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(46, 134, 171, 0.32);
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: var(--gray);
            font-weight: 600;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 900;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #FEE2E2;
            color: var(--danger);
            padding: 13px 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: none;
            font-weight: 700;
            border-left: 5px solid var(--danger);
        }

        .success-message {
            background: #D1FAE5;
            color: var(--success);
            padding: 13px 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: none;
            font-weight: 700;
            border-left: 5px solid var(--success);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--gray);
            font-weight: 600;
        }

        @media (max-width: 520px) {
            .auth-card {
                padding: 30px 22px;
            }

            .logo h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h2>ElectroGuard</h2>
                <p>Smart Electricity Anomaly Detection</p>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username or Email</label>
                    <input type="text" id="username" placeholder="Enter your username or email" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="{{ url_for('auth.signup_page') }}">Sign up</a>
            </div>

            <div class="auth-footer">
                AI-Powered Smart Grid Monitoring Platform
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = data.message;
                    successDiv.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
