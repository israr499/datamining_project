{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <div>
                <i class="fas fa-bolt"></i>
                <h2>ElectroGuard</h2>
                <p>Email Verification</p>
            </div>
        </div>

        <div id="error-message" class="error-message" style="display:none;"></div>
        <div id="success-message" class="success-message" style="display:none;"></div>

        <p style="text-align:center; margin-bottom:20px; color:#7F8C8D;">
            We sent a 6-digit OTP to:
            <br>
            <strong>{{ email }}</strong>
        </p>

        <form id="otp-form">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Enter OTP</label>
                <input 
                    type="text" 
                    id="otp" 
                    maxlength="6" 
                    placeholder="Enter 6-digit OTP"
                    required
                    autocomplete="one-time-code"
                >
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-check-circle"></i> Verify OTP
            </button>
        </form>

        <button type="button" class="btn-secondary" onclick="resendOTP()" style="width:100%; margin-top:12px;">
            <i class="fas fa-paper-plane"></i> Resend OTP
        </button>

        <div class="login-link">
            <p>Wrong email? <a href="{{ url_for('auth.signup_page') }}">Sign up again</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const otpForm = document.getElementById('otp-form');
const errorMessage = document.getElementById('error-message');
const successMessage = document.getElementById('success-message');

function showError(message) {
    errorMessage.style.display = 'block';
    successMessage.style.display = 'none';
    errorMessage.textContent = message;
}

function showSuccess(message) {
    successMessage.style.display = 'block';
    errorMessage.style.display = 'none';
    successMessage.textContent = message;
}

otpForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const otp = document.getElementById('otp').value.trim();

    if (!otp || otp.length !== 6) {
        showError('Please enter a valid 6-digit OTP.');
        return;
    }

    fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp: otp })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showSuccess(data.message || 'OTP verified successfully.');

            setTimeout(() => {
                window.location.href = data.redirect || '/';
            }, 1000);
        } else {
            showError(data.message || 'OTP verification failed.');

            if (data.redirect) {
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            }
        }
    })
    .catch(error => {
        showError('Error verifying OTP: ' + error.message);
    });
});

function resendOTP() {
    showSuccess('Sending new OTP...');

    fetch('/api/resend-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showSuccess(data.message || 'New OTP sent successfully.');
        } else {
            showError(data.message || 'Failed to resend OTP.');

            if (data.redirect) {
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            }
        }
    })
    .catch(error => {
        showError('Error resending OTP: ' + error.message);
    });
}
</script>
{% endblock %}
